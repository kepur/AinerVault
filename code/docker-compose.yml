# ─────────────────────────────────────────────────────────────
# Ainer 开发环境 Docker Compose
# 用法: cp .env.example .env && docker compose up -d
# ─────────────────────────────────────────────────────────────
name: ainer-dev

services:
  # ── 基础设施 ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 应用服务 ──────────────────────────────────────────────
  studio-api:
    profiles: ["legacy"]   # 冻结：默认不启动，`docker compose --profile legacy up` 可拉起
    build:
      context: .
      dockerfile: apps/ainern2d-studio-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${STUDIO_API_PORT:-8000}:8000"
    volumes:
      - studio_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-hub:
    profiles: ["legacy"]   # 冻结：默认不启动，`docker compose --profile legacy up` 可拉起
    build:
      context: .
      dockerfile: apps/ainern2d-worker-hub/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WORKER_HUB_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  composer:
    profiles: ["legacy"]   # 冻结：默认不启动，`docker compose --profile legacy up` 可拉起
    build:
      context: .
      dockerfile: apps/ainern2d-composer/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${COMPOSER_PORT:-8020}:8020"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  studio-web:
    profiles: ["legacy"]   # 冻结：默认不启动，`docker compose --profile legacy up` 可拉起
    build:
      context: .
      dockerfile: apps/ainern2d-studio-web/Dockerfile
    restart: unless-stopped
    environment:
      - VITE_PROXY_TARGET=http://studio-api:8000
    ports:
      - "5173:5173"
    depends_on:
      - studio-api

  # ── 反向代理 ──────────────────────────────────────────────
  nginx:
    profiles: ["legacy"]   # 冻结：默认不启动，`docker compose --profile legacy up` 可拉起
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - studio-api
      - worker-hub
      - composer
      - studio-web

  # ── v2 主线 ──────────────────────────────────────────────────────────────
  ainer-core:
    build:
      context: .
      dockerfile: apps/ainer-core/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CORE_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ainer}:${POSTGRES_PASSWORD:-ainer_dev_2024}@postgres:5432/${POSTGRES_DB:-ainer_dev}
      CORE_REDIS_URL: redis://redis:6379/1
      CORE_PUBLIC_BASE_URL: http://ainer-core:8100
      CORE_CALLBACK_SECRET: ${CORE_CALLBACK_SECRET:-whsec_dev_change_me}
    ports:
      - "${CORE_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-gateway:
    build:
      context: .
      dockerfile: apps/ainer-core/Dockerfile.mock
    restart: unless-stopped
    environment:
      MOCK_LATENCY_FACTOR: "${MOCK_LATENCY_FACTOR:-1.0}"
      MOCK_FAIL_RATE: "${MOCK_FAIL_RATE:-0}"
      MOCK_PUBLIC_URL: http://mock-gateway:8199
    ports:
      - "${MOCK_GATEWAY_PORT:-8199}:8199"

volumes:
  pg_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  studio_uploads:
