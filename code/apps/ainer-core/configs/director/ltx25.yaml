# LTX 2.5 成片（V1 关闭：feature_flags.ltx25_enabled=false）
#
# 只做了参数校验、payload 组装和 mock 返回，不跑推理。开之前要准备：
#   Lightricks/LTX-2.5 22B 底模、IC-LoRA（Union-Control / Motion-Track），以及对应的网关工作流。
capability: video.image_to_video
route_purpose: director_final_ltx25
resolution: [1280, 704]
fps: 24
union_control:
  types: [depth, pose, canny]   # 一个 LoRA 同时吃多种控制
  strengths: {depth: 0.8, pose: 1.0, canny: 0.6}
motion_track:
  enabled: false               # 运动轨迹控制（点轨迹）
audio: false                   # 2.x 能同时出音轨；V1 不用
