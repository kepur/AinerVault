<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AinerN2D Core</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234ea88f'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' font-weight='700' fill='%230f1416' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1416; --panel:#151c1f; --panel-2:#1b2427; --line:#263236; --line-soft:#1f2a2d;
  --ink:#e6eeec; --body:#a8b8b5; --muted:#6f8380;
  --accent:#4ea88f; --accent-dim:#1d3a33; --accent-ink:#0f1416;
  --warn:#d9a441; --warn-dim:#332a15; --danger:#d4664c; --danger-dim:#331c16;
  --ok:#4ea88f;
  --mono:"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f4f6f5; --panel:#fff; --panel-2:#eef2f1; --line:#dbe3e1; --line-soft:#e8eeec;
    --ink:#111a1c; --body:#3d4a48; --muted:#728380;
    --accent:#2b7a66; --accent-dim:#dcece6; --accent-ink:#fff;
    --warn:#8a6414; --warn-dim:#f5ecd8; --danger:#a8452f; --danger-dim:#f6e3de;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font:14px/1.6 var(--sans);
     -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical}

/* layout */
.app{display:grid;grid-template-columns:var(--sidew,214px) 1fr;min-height:100vh;
     transition:grid-template-columns .2s cubic-bezier(.2,.8,.3,1)}
.app.collapsed{--sidew:56px}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 0;
      display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{padding:0 16px 13px;border-bottom:1px solid var(--line-soft);margin-bottom:8px;
       display:flex;align-items:center;gap:9px}
.brand .mark{width:24px;height:24px;border-radius:6px;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--mono);flex:none}
.brand .txt{min-width:0;overflow:hidden}
.brand b{color:var(--ink);font-size:13.5px;letter-spacing:.02em;display:block;white-space:nowrap}
.brand span{display:block;font:10.5px/1.4 var(--mono);color:var(--muted);white-space:nowrap}
.collapsed .brand .txt{display:none}

/* 折叠开关：贴在侧栏右缘，不占菜单位置 */
.sidetoggle{position:absolute;left:calc(var(--sidew,214px) - 11px);top:17px;z-index:30;
  width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--muted);display:grid;place-items:center;font-size:10px;padding:0;
  transition:left .2s cubic-bezier(.2,.8,.3,1),transform .2s,color .12s}
.sidetoggle:hover{color:var(--accent);border-color:var(--accent)}
.collapsed .sidetoggle{transform:rotate(180deg)}

.nav{display:flex;flex-direction:column;gap:1px;padding:0 7px;overflow-y:auto;overflow-x:hidden}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

.navgrp{margin-top:9px}
.navgrp:first-child{margin-top:0}
.navgrp>.gh{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;
  color:var(--muted);font:10px/1.6 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  padding:6px 9px 4px;text-align:left}
.navgrp>.gh:hover{color:var(--body)}
.navgrp>.gh .caret{margin-left:auto;font-size:8px;transition:transform .18s;opacity:.6}
.navgrp.shut>.gh .caret{transform:rotate(-90deg)}
.navgrp .items{display:grid;grid-template-rows:1fr;transition:grid-template-rows .2s ease}
.navgrp.shut .items{grid-template-rows:0fr}
.navgrp .items>div{overflow:hidden;min-height:0}
.collapsed .navgrp>.gh{display:none}
.collapsed .navgrp .items{grid-template-rows:1fr!important}

.nav button.item{display:flex;align-items:center;gap:10px;background:none;border:0;
  color:var(--body);padding:8px 9px;border-radius:7px;text-align:left;font-size:13.5px;
  width:100%;position:relative;transition:background .12s,color .12s}
.nav button.item:hover{background:var(--panel-2);color:var(--ink)}
.nav button.item:active{transform:scale(.975)}
.nav button.item.on{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav button.item.on::before{content:"";position:absolute;left:-7px;top:7px;bottom:7px;width:2.5px;
  border-radius:0 2px 2px 0;background:var(--accent)}
.nav .ico{width:18px;text-align:center;flex:none;font-size:14px}
.nav .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collapsed .nav .lbl{display:none}
.collapsed .nav button.item{justify-content:center;padding:9px 0}
/* 收起后靠悬浮标签认菜单 */
.collapsed .nav button.item:hover .lbl{display:block;position:absolute;left:calc(100% + 9px);
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;
  font-size:12.5px;color:var(--ink);z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.navbadge{margin-left:auto;font:9.5px/1.4 var(--mono);background:var(--accent-dim);
  color:var(--accent);padding:1px 5px;border-radius:8px;flex:none}
.collapsed .navbadge{position:absolute;top:4px;right:6px;margin:0;padding:0;
  width:6px;height:6px;border-radius:50%;font-size:0;background:var(--accent)}
.side-foot{margin-top:auto;padding:11px 16px 0;border-top:1px solid var(--line-soft);
  font:11px/1.6 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.collapsed .side-foot{padding:11px 0 0;text-align:center}
.collapsed .side-foot .fl{display:none}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:5px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:10;min-height:53px}
.top h1{margin:0;font-size:15px;color:var(--ink);font-weight:600}
.top .sub{font:11.5px/1.4 var(--mono);color:var(--muted)}
.top .grow{flex:1}
.content{padding:22px;max-width:1240px;width:100%}

/* bits */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:13px;transition:border-color .15s}
.card:hover{border-color:var(--line)}
.card h2 .tag{margin-left:7px;vertical-align:1px}
.card h2{margin:0 0 4px;font-size:14px;color:var(--ink);font-weight:600}
.card .hint{margin:0 0 14px;font-size:12.5px;color:var(--muted);max-width:70ch}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:block;font:11px/1.7 var(--mono);color:var(--muted);letter-spacing:.06em;
      text-transform:uppercase;margin-bottom:3px}

.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:7px 13px;border-radius:7px;font-size:13px;white-space:nowrap;position:relative;
  overflow:hidden;transition:border-color .13s,color .13s,transform .08s,box-shadow .13s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
/* 按下去要有回应 —— 没有反馈的按钮会被连点，然后撞幂等键 */
.btn:active{transform:translateY(1px) scale(.985)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink);
  box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
/* 点击涟漪：纯 CSS，靠 :active 触发，无 JS */
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle,currentColor 12%,transparent 12%) center/220% 220% no-repeat;
  opacity:0;transition:background-size .45s,opacity .55s}
.btn:active::after{background-size:0 0;opacity:.16;transition:0s}

.tag{display:inline-block;font:10.5px/1.5 var(--mono);padding:2px 7px;border-radius:5px;
  letter-spacing:.05em;white-space:nowrap}
.t-info{background:var(--panel-2);color:var(--accent)}
/* 严重度色阶：1–2 静音、3 提示、4–5 告警。颜色本身就是排序 */
.sev{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;
  font:700 11px/1 var(--mono)}
.sev-1,.sev-2{background:var(--panel-2);color:var(--muted)}
.sev-3{background:var(--warn-dim);color:var(--warn)}
.sev-4,.sev-5{background:var(--danger-dim);color:var(--danger)}
.t-ok{background:var(--accent-dim);color:var(--accent)}
.t-warn{background:var(--warn-dim);color:var(--warn)}
.t-bad{background:var(--danger-dim);color:var(--danger)}
.t-mute{background:var(--panel-2);color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:10.5px/1.6 var(--mono);color:var(--muted);letter-spacing:.1em;
   text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .11s}
tbody tr:hover{background:var(--panel-2)}
.mono{font-family:var(--mono);font-size:12px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel)}

.steps{display:flex;gap:0;flex-wrap:wrap;margin-bottom:14px}
.step{flex:1;min-width:118px;background:var(--panel);border:1px solid var(--line);
  padding:9px 12px;position:relative}
.step:first-child{border-radius:7px 0 0 7px}
.step:last-child{border-radius:0 7px 7px 0}
.step+.step{border-left:0}
.step .k{font:10px/1.5 var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.step .v{font-size:15px;color:var(--ink);font-weight:600;margin-top:2px}
.step.done .v{color:var(--accent)}
.step.blocked .v{color:var(--danger)}

.para{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:11px 0;
  border-bottom:1px solid var(--line-soft)}
.para:last-child{border-bottom:0}
.para .src{color:var(--muted);font-size:13px}
.para .tgt{color:var(--ink);font-size:13.5px}
.para .meta{grid-column:1/-1;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.para.skip{opacity:.5}

.log{background:#0a0e10;border:1px solid var(--line);border-radius:7px;padding:11px 13px;
  font:12px/1.65 var(--mono);color:#8fb3ab;max-height:280px;overflow:auto;white-space:pre-wrap;
  word-break:break-word}
@media(prefers-color-scheme:light){.log{background:#12191b;color:#a8ccc3}}
.log .e{color:#d4664c} .log .w{color:#d9a441} .log .s{color:#4ea88f} .log .d{color:#6f8380}

.empty{padding:34px 14px;text-align:center;color:var(--muted);font-size:13px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.hide{display:none!important}
.content>.card{animation:rise .22s cubic-bezier(.2,.8,.3,1) both}
.content>.card:nth-child(2){animation-delay:.03s}
.content>.card:nth-child(3){animation-delay:.06s}
.content>.card:nth-child(n+4){animation-delay:.09s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 差异审查：原文/译文对照 + 裁决 */
.gap{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:9px;
  background:var(--panel);transition:border-color .13s}
.gap:hover{border-color:var(--accent)}
.gap.done{opacity:.55}
.gap .gh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.gap .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.gap .pair>div{background:var(--panel-2);border-radius:7px;padding:8px 10px;font-size:12.5px}
.gap .pair .k{font:9.5px/1.5 var(--mono);color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:3px}
.gap .eff{font-size:12.5px;color:var(--body);margin:6px 0}
.gap .prop{background:var(--accent-dim);border-radius:7px;padding:9px 11px;margin:8px 0;
  font-size:12.5px;color:var(--ink)}
.gap .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
@media(max-width:760px){.gap .pair{grid-template-columns:1fr}}

@media(prefers-reduced-motion:reduce){
  .content>.card{animation:none}
  .app,.sidetoggle,.navgrp .items{transition:none}
  .btn:active{transform:none}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;
        padding:10px 0}
  .brand{border:0;margin:0;padding:0 12px 0 16px;white-space:nowrap}
  .brand .txt{display:none}
  .nav{flex-direction:row;padding:0 8px;overflow-x:auto}
  .navgrp{margin:0}
  .navgrp>.gh{display:none}
  .navgrp .items{grid-template-rows:1fr!important}
  .navgrp .items>div{display:flex;gap:2px}
  .nav .lbl{display:none}
  .nav button.item{padding:8px 11px}
  .nav button.item.on::before{display:none}
  .sidetoggle,.side-foot{display:none}
  .para{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <button class="sidetoggle" onclick="App.toggleSide()" title="收起/展开菜单">◀</button>
  <aside class="side">
    <div class="brand">
      <div class="mark">N</div>
      <div class="txt"><b>AinerN2D</b><span>core v2</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div><span class="dot" id="dot-core"></span><span class="fl">core <span id="st-core">…</span></span></div>
      <div><span class="dot" id="dot-gw"></span><span class="fl">gateway <span id="st-gw">…</span></span></div>
      <div class="fl" style="margin-top:6px"><a href="/docs" target="_blank">API 文档 →</a></div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="page-title">设置</h1>
      <span class="sub" id="page-sub"></span>
      <span class="grow"></span>
      <span class="sub" id="task-badge"></span>
      <button class="btn sm" onclick="App.refresh()">刷新</button>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<script>
const API = "/api/v2";
const $ = (s, r=document) => r.querySelector(s);
const h = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const detail = data && data.detail !== undefined ? data.detail : data;
    const err = new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
    err.status = res.status; err.detail = detail;
    throw err;
  }
  return data;
}

const State = {
  page: localStorage.getItem("an.page") || "settings",
  novelId: localStorage.getItem("an.novel") || "",
  chapterId: localStorage.getItem("an.chapter") || "",
  lang: localStorage.getItem("an.lang") || "en-GB",
  mTab: localStorage.getItem("an.mtab") || "characters",
  transformId: localStorage.getItem("an.transform") || "",
  save() {
    localStorage.setItem("an.page", this.page);
    localStorage.setItem("an.novel", this.novelId);
    localStorage.setItem("an.chapter", this.chapterId);
    localStorage.setItem("an.lang", this.lang);
    localStorage.setItem("an.transform", this.transformId);
    localStorage.setItem("an.mtab", this.mTab);
  },
};

// 菜单按「工作流的先后」分组，不按功能相似度 ——
// 用户是顺着流程走的，把「世界观」和「译本」分在两个抽屉里
// 只会让人每次都要开两个抽屉。
const GROUPS = [
  {id:"g-src", name:"素材", pages:[
    {id:"library",  ico:"📚", name:"书架", sub:"小说与章节"},
  ]},
  {id:"g-world", name:"世界观", pages:[
    {id:"world",    ico:"🌍", name:"映射与词表", sub:"映射 · 名物词表 · 人名 · 称呼"},
    {id:"model",    ico:"🧩", name:"世界模型", sub:"人物 · 场景 · 道具 · 节拍 · 风格"},
    {id:"culture",  ico:"🎭", name:"文化梗", sub:"网络梗 · 典故 · 九档呈现策略"},
    {id:"epochs",   ico:"⏳", name:"人物时期", sub:"脸跨期不变 · 衣着兵器随期变"},
    {id:"prompts",  ico:"🖼", name:"提示词台账", sub:"素材生图提示词 · 依据 · 引用"},
  ]},
  {id:"g-trans", name:"译本", pages:[
    {id:"prose",    ico:"✍", name:"译本工作台", sub:"分块 → 装置 → 翻译 → 审核 → 回译 → 锁定"},
    {id:"review",   ico:"🔍", name:"文化差异审查", sub:"模型出报表，人裁决"},
  ]},
  {id:"g-media", name:"成品", pages:[
    {id:"script",   ico:"🎬", name:"剧本转换", sub:"场景 · 时间 · 天气 · 氛围 · 对白"},
    {id:"staging",  ico:"🎭", name:"分镜调度", sub:"站位 · 朝向 · 视线 · 表情 · 动作"},
    {id:"crew",     ico:"🎥", name:"制作单", sub:"摄影 · 灯光 · 美术 · 声音 · 剪辑 · 场记"},
    {id:"casting",  ico:"🎙", name:"配音表", sub:"音色绑定 · 撞声 · 时期演化"},
    {id:"audio",    ico:"🎧", name:"有声书", sub:"音色与时间轴"},
  ]},
  {id:"g-sys", name:"系统", pages:[
    {id:"tasks",    ico:"⚡", name:"任务", sub:"生成任务与成本"},
    {id:"settings", ico:"⚙", name:"设置", sub:"端点 · 能力路由 · 质量档位"},
  ]},
];
const PAGES = GROUPS.flatMap(g => g.pages);

let logBuf = [];
function log(msg, cls="") {
  const t = new Date().toTimeString().slice(0,8);
  logBuf.push(`<span class="d">${t}</span> <span class="${cls}">${h(msg)}</span>`);
  if (logBuf.length > 200) logBuf.shift();
  const el = $("#log");
  if (el) { el.innerHTML = logBuf.join("\n"); el.scrollTop = el.scrollHeight; }
}
const logOk = m => log(m, "s"), logWarn = m => log(m, "w"), logErr = m => log(m, "e");

async function run(btn, fn, label) {
  const old = btn ? btn.innerHTML : null;
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${label||"处理中"}`; }
  try { return await fn(); }
  catch (e) { logErr(`${label||"操作"}失败：${e.message}`); throw e; }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}

const NAMETYPE_CN = {
  proper: "专名", role: "职务", epithet: "名号", generic: "泛指",
};
const NAMETYPE_HINT = {
  proper: "有专属名字 —— 会在目标文化里造一个等效专名",
  role: "以职务／身份指代 —— 走名物词表，不生成人名",
  epithet: "描述性名号 —— 意译，不音译",

    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");

  async add(btn) {
    const name = $("#ep-name").value.trim(), url = $("#ep-url").value.trim();
    if (!name || !url) return logErr("名称与地址必填");
    const mode = $("#ep-mode").value, token = $("#ep-token").value.trim();
    const auth = {mode};
    if (mode !== "none") auth.token = token;
    if (mode === "header") auth.header_name = $("#ep-header").value.trim() || "X-API-Key";
    await run(btn, async () => {
      const dialect = ($("#ep-dialect")||{}).value || "capability";
      const ep = await api("POST", "/settings/endpoints",
                           {name, base_url: url, auth, dialect});
      logOk(`端点 ${name} 已添加`);
      const t = await api("POST", `/settings/endpoints/${ep.id}:test`);
      t.ok ? logOk(`探活成功，契约 v${t.version}`) : logErr(`探活失败：${JSON.stringify(t.error)}`);
      if (t.ok) {
        const c = await api("POST", `/settings/endpoints/${ep.id}:refresh-caps`);
        logOk(`能力目录 ${c.capabilities.length} 项`);
        if (c.missing_required.length) logWarn(`缺主线必需能力：${c.missing_required.join(", ")}`);
      }
      App.refresh();
    }, "添加中");
  },
  async test(id, btn) {
    await run(btn, async () => {
      const t = await api("POST", `/settings/endpoints/${id}:test`);
      t.ok ? logOk(`探活成功 v${t.version}`) : logErr(`探活失败：${JSON.stringify(t.error)}`);
      App.refresh();
    }, "测试");
  },
  async sync(id, btn) {
    await run(btn, async () => {
      const c = await api("POST", `/settings/endpoints/${id}:refresh-caps`);
      logOk(`能力 ${c.capabilities.length} 项：${c.capabilities.join(", ")}`);
      if (c.missing_required.length) logWarn(`缺必需能力：${c.missing_required.join(", ")}`);
      App.refresh();
    }, "拉取");
  },
  async del(id, btn) {
    if (!confirm("删除该端点？相关路由会失效。")) return;
    await run(btn, async () => {
      await api("DELETE", `/settings/endpoints/${id}`);
      logOk("端点已删除"); App.refresh();
    }, "删除");
  },
  async seed(btn) {
    await run(btn, async () => {
      const r = await api("POST", "/worldview:seed");
      logOk(`世界观 +${r.profiles}　词表 +${r.templates}　导演包 +${r.director_profiles}`);
    }, "灌入");
  },
  async autoRoute(btn) {
    await run(btn, async () => {
      const eps = await api("GET", "/settings/endpoints");
      const usable = eps.filter(e => e.enabled && e.capabilities_count > 0);
      if (!usable.length) return logErr("没有可用端点，请先添加并拉取能力");
      const PURPOSES = {
        "text.chat": ["*","script","extract","naming","asset_variant","shot_plan",
                      "lexicon","review"],
        "text.translate": ["*","translate"],
        "audio.tts": ["*","dialogue","narration","voice_ref"],
        "audio.music": ["*","bgm"],
        "audio.sfx": ["*","sfx","room_tone","ambience"],
        "image.text_to_image": ["*","asset_ref","first_frame","scene_bg"],
        "image.image_to_image": ["*","last_frame"],
        "video.image_to_video": ["*"],
      };
      const routes = [];
      for (const ep of usable) {
        const caps = await api("GET", "/settings/capabilities");
        for (const c of caps.capabilities) {
          const has = c.models.some(m => m.endpoint_id === ep.id);
          if (!has) continue;
          for (const p of (PURPOSES[c.capability] || ["*"])) {
            if (routes.some(r => r.capability===c.capability && r.purpose===p)) continue;
            routes.push({capability: c.capability, purpose: p, endpoint_id: ep.id});
          }
        }
      }
      const r = await api("PUT", "/settings/routes", routes);
      logOk(`生成 ${r.count} 条路由`);
      App.refresh();
    }, "生成中");
  },
};

    const tgt = $("#tf-tgt"), lang = $("#tf-lang");

    const want = tgt.options[tgt.selectedIndex]?.dataset.lang;

    }, "导入");
  },
  async promoteTpl(btn) {
    await run(btn, async () => {

        `/transforms/${State.transformId}/lexicon:promote-template`);
      logOk(r.action === "created"
        ? `已建模板 ${r.pair_code} v${r.version}，${r.total} 条`
        : `已并入模板 ${r.pair_code}，新增 ${r.added} 条，共 ${r.total} 条`);
      App.refresh();

  async approveHits(btn) {
    await run(btn, async () => {
      const pf = await api("GET", `/transforms/${State.transformId}/preflight`);
      const hits = new Set((pf.coverage.top_hits||[]).map(x=>x.source));
      const lex = await api("GET", `/transforms/${State.transformId}/lexicon`);
      const ids = lex.filter(r=>hits.has(r.source_term) && r.target_term).map(r=>r.id);
      if (!ids.length) return logWarn("没有命中的词条可审核");
      const r = await api("POST",
        `/transforms/${State.transformId}/lexicon:batch-approve`, {ids});
      logOk(`通过 ${r.approved} 条（只审本书命中的，不是全表）`); App.refresh();
    }, "审核中");

    if (!State.chapterId) return logErr("请先在书架选一个章节");
    await run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/entities:extract`, {});

                Model.nameTypeCell(r),

      beats:      {n:"剧情节拍", cols:["#","节拍","张力","地点","出场","原文证据"],

    const T = TABS[tab], rows = data[tab] || [];

               onclick="Model.tab('${k}')">
            <div class="k">${TABS[k].n}</div><div class="v">${c[k]||0}</div></div>`).join("")}
      </div>
      <div class="card">
        <h2>${T.n} <span class="sub mono" style="color:var(--muted)">${rows.length} 条</span></h2>
        ${rows.length ? `<div class="tblwrap"><table><thead><tr>${
          T.cols.map(x=>`<th>${h(x)}</th>`).join("")}</tr></thead><tbody>${
          rows.map(r=>`<tr>${T.row(r).map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")
        }</tbody></table></div>` : `<div class="empty">这一类还没有内容</div>`}
      </div>` : `<div class="card"><div class="empty">还没有抽离过，点「开始抽离」</div></div>`}
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  tab(k) { State.mTab = k; State.save(); App.refresh(); },
  async extract(btn, force) {
    const lvl = $("#wm-level") ? $("#wm-level").value : 2;
    await run(btn, async () => {
      const r = await api("POST",
        `/chapters/${State.chapterId}/entities:extract?min_importance=${lvl}`, {});
      logOk(`抽离完成：实体 新建 ${r.created} / 更新 ${r.updated} / 合计 ${r.total}　`
            + `节拍 ${r.beats}　风格 ${r.style_hints}`);
      if (r.by_kind && Object.keys(r.by_kind).length)
        log(`  分类：${Object.entries(r.by_kind).map(([k,n])=>`${k} ${n}`).join("、")}`);
      if (r.names && r.names.length) log(`  新增：${r.names.join("、")}`);
      App.refresh();
    }, force ? "重新抽离" : "抽离中");
  },
};

// ───────────────────────── 剧本转换 ─────────────────────────
const Script = {
  async render(v) {
    if (!State.chapterId) { v.innerHTML = `<div class="card"><div class="empty">
      请先在「书架」打开一个章节</div></div>`; return; }
    const [ch, doc] = await Promise.all([
      api("GET", `/chapters/${State.chapterId}`),
      api("GET", `/chapters/${State.chapterId}/script`).catch(()=>null),
    ]);
    v.innerHTML = `
      <div class="card">
        <h2>${h(ch.title||"")} <span class="sub mono" style="color:var(--muted)">
          ${ch.word_count} 字</span></h2>
        <p class="hint">把章节拆成场景与内容块，带时间、地点、天气、氛围。
          与译本分块的区别：译本是纯规则按段落切，剧本要 LLM 理解场景边界与说话人。</p>
        <div class="row">
          <label style="margin:0;text-transform:none;letter-spacing:0;font-family:var(--sans);
                        font-size:12.5px;color:var(--muted)">切分粒度</label>
          <select id="sc-gran" style="width:auto">
            <option value="medium">普通 normal</option>
            <option value="fine">细 fine</option>
            <option value="coarse">粗 coarse</option>
          </select>
          <label style="margin:0;text-transform:none;letter-spacing:0;font-family:var(--sans);
                        font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px">
            <input type="checkbox" id="sc-keep" checked style="width:auto"> 保留人工编辑</label>
          <button class="btn pri" onclick="Script.gen(this)">剧本转换</button>
          <button class="btn" onclick="Script.gen(this,true)"
            style="border-color:var(--warn);color:var(--warn)">重新生成（消耗 Token）</button>
        </div>
      </div>
      ${doc && doc.scenes ? `
      <div class="steps">
        <div class="step done"><div class="k">版本</div><div class="v">v${doc.version}</div></div>
        <div class="step done"><div class="k">场景</div><div class="v">${doc.scenes.length}</div></div>
        <div class="step done"><div class="k">内容块</div>
          <div class="v">${doc.scenes.reduce((n,s)=>n+(s.blocks||[]).length,0)}</div></div>
        <div class="step"><div class="k">状态</div><div class="v">${h(doc.status||"")}</div></div>
      </div>
      ${doc.scenes.map(sc=>`<div class="card">
        <h2>${h(sc.title||`场景 ${sc.order_no}`)}</h2>
        <div class="tblwrap" style="margin-bottom:12px"><table><tbody>
          <tr><th style="width:90px">地点</th><td>${h(sc.location_text||"—")}</td>
              <th style="width:90px">时间</th><td>${h(sc.time_of_day||"—")}</td></tr>
          <tr><th>天气</th><td>${h(sc.weather||"—")}</td>
              <th>氛围</th><td>${h(sc.mood||"—")}</td></tr>
        </tbody></table></div>
        ${sc.summary?`<p class="hint" style="margin:0 0 12px">${h(sc.summary)}</p>`:""}
        ${(sc.blocks||[]).map(b=>`<div style="display:flex;gap:10px;padding:5px 0;
             border-bottom:1px solid var(--line-soft)">
          <span class="tag ${b.type==='dialogue'?'t-ok':'t-mute'}"
                style="flex:none;min-width:74px;text-align:center">${h(b.type)}</span>
          ${b.speaker?`<span class="mono" style="flex:none;min-width:56px;color:var(--accent)">${h(b.speaker)}</span>`:""}
          <span style="color:var(--ink)">${h(b.source_text||b.text||"")}</span>
        </div>`).join("")}
      </div>`).join("")}
      ` : `<div class="card"><div class="empty">还没有剧本，点「剧本转换」</div></div>`}
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  async gen(btn, force) {
    await run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/script:generate`, {
        scene_granularity: $("#sc-gran").value,
        keep_human_edits: $("#sc-keep").checked,
      });
      logOk(`剧本 v${r.version}：场景 ${(r.scenes||[]).length}　`
            + `块 ${(r.scenes||[]).reduce((n,s)=>n+(s.blocks||[]).length,0)}`);
      App.refresh();
    }, force ? "重新生成" : "转换中");
  },
};

// ───────────────────────── 译本工作台 ─────────────────────────
const Prose = {
  async render(v) {
    if (!State.chapterId) { v.innerHTML = `<div class="card"><div class="empty">
      请先在「书架」打开一个章节</div></div>`; return; }
    // 本地记的 id 可能已失效（数据被删、换了小说），每次进页面自愈一次
    await App.ensureTransform();
    const lang = State.lang;
    const [ch, status] = await Promise.all([
      api("GET", `/chapters/${State.chapterId}`),
      api("GET", `/chapters/${State.chapterId}/prose/${lang}/status`).catch(()=>null),
    ]);
    let prose = null, violations = [];
    if (status && status.stage !== "not_started") {
      prose = await api("GET",
        `/chapters/${State.chapterId}/prose/${lang}?with_source=true`).catch(()=>null);
    }
    if (State.transformId) {
      violations = await api("GET",
        `/transforms/${State.transformId}/violations?status=open`).catch(()=>[]);
    }
    const st = status || {};
    const vByBlock = {};
    violations.forEach(x => {
      const b = (x.evidence||{}).block_id; if (b) (vByBlock[b] ||= []).push(x);
    });

    v.innerHTML = `
      <div class="steps">
        <div class="step ${st.blocks?'done':''}"><div class="k">分块</div>
          <div class="v">${st.blocks ?? "—"}</div></div>
        <div class="step ${st.translated?'done':''}"><div class="k">已译</div>
          <div class="v">${st.translated ?? 0}</div></div>
        <div class="step ${st.open_high_violations?'blocked':'done'}"><div class="k">高危违规</div>
          <div class="v">${st.open_high_violations ?? 0}</div></div>
        <div class="step ${st.locked?'done':''}"><div class="k">已锁定</div>
          <div class="v">${st.locked ?? 0}</div></div>
        <div class="step"><div class="k">有声书</div>
          <div class="v">${st.audiobook ? `${st.audiobook.generated}/${st.audiobook.segments}` : "—"}</div></div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <h2>${h(ch.title||"")} <span class="sub mono" style="color:var(--muted)">
              ${ch.word_count} 字 · ${h(lang)}</span></h2>
            <p class="hint" style="margin:2px 0 0">${h(st.next_step || "先执行分块")}</p>
          </div>
          <div class="row" style="gap:7px">
            <select id="pr-mode" style="width:auto" title="翻译模式">
              <option value="adaptive">改编模式（保效果）</option>
              <option value="literal">逐句模式（保字面）</option>
            </select>
            <select id="pr-lang" style="width:auto" onchange="Prose.setLang(this.value)">
              ${["en-GB","en-US","ja-JP","ko-KR","fr-FR"].map(l=>
                `<option ${l===lang?"selected":""}>${l}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" onclick="Prose.build(this)">1 分块</button>
          <button class="btn" onclick="Prose.translate(this)">2 翻译</button>
          <button class="btn" onclick="Prose.devices(this)">3 装置抽离</button>
          <button class="btn" onclick="Prose.review(this)">4 二次审核</button>
          <button class="btn" onclick="Prose.backCheck(this)">5 回译校验</button>
          <button class="btn" onclick="Prose.audit(this)">6 全书审计</button>
          <button class="btn" onclick="Prose.lock(this)">7 锁定</button>
          <span style="flex:1"></span>
          <button class="btn pri" onclick="Prose.runAll(this)">▶ 一键跑完</button>
        </div>
        <p class="hint" style="margin:9px 0 0">
          <b>改编模式</b>按叙事骨架与装置重写，允许调整句式以保住笑点与情绪 ——
          判断标准是目标读者的反应是否与中文读者相同，不是字面像不像。
          <b>装置抽离</b>找出「换个语言就会失效」的地方并给出重铸策略；
          <b>回译校验</b>把成品译回中文与骨架比对，查情节点丢没丢。</p>
      </div>

      ${State.transformId ? "" : `<div class="card" style="border-color:var(--warn)">
        <h2 style="color:var(--warn)">尚未选定世界观映射</h2>
        <p class="hint">翻译与审核都依赖它 —— 映射决定人名怎么转、名物怎么叫。</p>
        <button class="btn pri" onclick="App.go('world')">去「世界观」创建 →</button>
      </div>`}

      <div id="check-box"></div>
      <div id="audit-box"></div>

      ${prose ? `<div class="card">
        <h2>逐段对照 <span class="sub mono" style="color:var(--muted)">
          ${prose.stats.translated}/${prose.stats.blocks} 段 ·
          覆盖 ${Math.round(prose.stats.coverage*100)}%</span></h2>
        ${prose.paragraphs.map(p => {
          const vs = vByBlock[p.block_id] || [];
          return `<div class="para ${p.text?'':'skip'}">
            <div class="src">${h(p.source||"")}</div>
            <div class="tgt">${p.text ? h(p.text) :
              '<span style="color:var(--muted)">（未翻译）</span>'}</div>
            <div class="meta">
              <span class="tag t-mute">${h(p.type)}</span>
              ${p.speaker?`<span class="tag t-mute">说话人 ${h(p.speaker)}</span>`:""}
              ${p.locked?'<span class="tag t-ok">已锁定</span>':""}
              ${vs.map(x=>`<span class="tag ${x.severity==='high'?'t-bad':'t-warn'}"
                title="${h(x.suggested_fix||"")}">${h(x.kind)}${x.expected?` → ${h(x.expected)}`:""}</span>`).join("")}
            </div></div>`;
        }).join("")}
      </div>` : ""}

      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>
    `;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  setLang(l) { State.lang = l; State.save(); App.refresh(); },

  async build(btn) {
    return run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/prose:build`, {force:true});
      logOk(`分块 ${r.blocks} 段（对白 ${r.dialogue}　旁白 ${r.narration}）`);
      if (r.speakers.length) log(`  说话人：${r.speakers.join("、")}`);
      App.refresh();
    }, "分块中");
  },
  async translate(btn) {
    return run(btn, async () => {
      try {
        const mode = $("#pr-mode") ? $("#pr-mode").value : "adaptive";
        const r = await api("POST",
          `/chapters/${State.chapterId}/translation/${State.lang}:run`,
          {only_missing:false, batch_size:8, mode});
        logOk(`翻译 ${r.translated} 段　重译 ${r.retried}　违规 ${r.violations}　跳过锁定 ${r.skipped_locked}`);
        if (r.missing_names && r.missing_names.length)
          logWarn(`缺译名：${r.missing_names.join("、")}`);
      } catch (e) {
        if (e.status === 409 && e.detail && e.detail.code === "PREFLIGHT_NOT_READY") {
          logWarn("门禁未过：" + e.detail.message);
          (e.detail.blocking||[]).forEach(b => logWarn(`  · ${b.message}`));
          if (confirm("世界观映射尚未审核完。强制翻译？\n\n（建议先去「世界观」页审核名物词表）")) {
            const r2 = await api("POST",
              `/chapters/${State.chapterId}/translation/${State.lang}:run`,
              {only_missing:false, batch_size:8, force:true,
               mode: ($("#pr-mode")||{value:"adaptive"}).value});
            logOk(`强制翻译 ${r2.translated} 段　违规 ${r2.violations}`);
          }
        } else throw e;
      }
      App.refresh();
    }, "翻译中");
  },
  async devices(btn) {
    return run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/devices:extract`, {});
      logOk(`装置 ${r.devices} 处　类型 ${JSON.stringify(r.by_type)}`);
      logOk(`  文化依赖分布 ${JSON.stringify(r.by_load)}`);
      (r.high_load||[]).slice(0,4).forEach(d =>
        logWarn(`  [高依赖] ${d.device_type}／${d.effect}：${String(d.source_text).slice(0,30)}`
                + `　依赖 ${(d.depends_on||[]).join("、")||"—"}`));
      App.refresh();
    }, "抽离中");
  },
  async backCheck(btn) {
    if (!State.transformId) return logErr("请先在「世界观」创建映射");
    return run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/prose:back-check`,
        {transform_id: State.transformId});
      const pct = x => Math.round((x||0)*100) + "%";
      logOk(`回译校验：情节保留 ${pct(r.beat_coverage)}　`
            + `装置命中 ${pct(r.device_landing)}　情绪吻合 ${pct(r.emotion_match)}　`
            + `通过=${r.passed}`);
      $("#check-box").innerHTML = `<div class="card">
        <h2>回译校验 ${r.passed
          ? '<span class="tag t-ok">通过</span>'
          : '<span class="tag t-bad">未通过</span>'}</h2>
        <p class="hint">把译文回译成中文，与叙事骨架逐点比对。
          只回答一个问题：<b>东西丢了没有</b> —— 不评价译文写得好不好。</p>
        <div class="steps" style="margin-bottom:12px">
          <div class="step ${r.beat_coverage>=0.9?'done':'blocked'}">
            <div class="k">情节保留</div><div class="v">${pct(r.beat_coverage)}</div></div>
          <div class="step ${r.device_landing>=0.9?'done':'blocked'}">
            <div class="k">装置命中</div><div class="v">${pct(r.device_landing)}</div></div>
          <div class="step ${r.emotion_match>=0.9?'done':'blocked'}">
            <div class="k">情绪吻合</div><div class="v">${pct(r.emotion_match)}</div></div>
          <div class="step ${r.contradictions.length?'blocked':'done'}">
            <div class="k">与骨架矛盾</div><div class="v">${r.contradictions.length}</div></div>
        </div>
        ${r.verdict?`<p class="hint" style="color:var(--body)">${h(r.verdict)}</p>`:""}
        ${r.missing_beats.length?`<h2 style="font-size:13px;margin-top:14px">丢失的情节点</h2>
          <div class="tblwrap"><table><tbody>${r.missing_beats.map(b=>`<tr>
            <td class="mono">${b.order}</td><td><b>${h(b.title)}</b>
            ${b.note?`<br><span style="color:var(--muted)">${h(b.note)}</span>`:""}</td>
          </tr>`).join("")}</tbody></table></div>`:""}
        ${r.lost_devices.length?`<h2 style="font-size:13px;margin-top:14px">未重铸的装置</h2>
          <div class="tblwrap"><table><thead><tr><th>类型</th><th>效果</th><th>强度</th>
            <th>原文</th><th>机制</th></tr></thead><tbody>${r.lost_devices.map(d=>`<tr>
            <td class="mono">${h(d.type)}</td><td class="mono">${h(d.effect)}</td>
            <td><span class="tag ${d.intensity>=4?'t-bad':'t-warn'}">${d.intensity}</span></td>
            <td>${h(d.source_text)}</td>
            <td style="color:var(--muted)">${h(d.mechanism)}</td>
          </tr>`).join("")}</tbody></table></div>`:""}
        ${r.contradictions.length?`<h2 style="font-size:13px;margin-top:14px">与情节骨架矛盾之处</h2>
          <ul style="margin:0;padding-left:18px;color:var(--danger)">${
            r.contradictions.map(x=>`<li>${h(x)}</li>`).join("")}</ul>`:""}
      </div>`;
      $("#check-box").scrollIntoView({behavior:"smooth", block:"nearest"});
    }, "回译中");
  },
  async review(btn) {
    if (!State.transformId) return logErr("请先在「世界观」创建映射");
    return run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/prose:review`,
        {transform_id: State.transformId, batch_size: 8});
      logOk(`审核 ${r.reviewed_blocks} 段　规则预筛 ${r.rule_prescreen}　发现 ${r.issues_found}　入库 ${r.recorded}`);
      Object.entries(r.by_type||{}).forEach(([k,c]) => log(`  ${k}: ${c}`));
      (r.samples||[]).slice(0,4).forEach(s =>
        logWarn(`  [${s.severity}] ${s.issue_type}：${String(s.detected).slice(0,40)}`));
      App.refresh();
    }, "审核中");
  },
  async audit(btn) {
    if (!State.transformId) return logErr("请先在「世界观」创建映射");
    return run(btn, async () => {
      const a = await api("GET", `/transforms/${State.transformId}/audit`);
      logOk(`审计 ${a.chapters_scanned} 章 ${a.blocks_scanned} 段　` +
            `高危 ${a.summary.high}　中 ${a.summary.medium}　通过=${a.passed}`);
      $("#audit-box").innerHTML = `<div class="card">
        <h2>全书一致性审计 ${a.passed
          ? '<span class="tag t-ok">通过</span>'
          : `<span class="tag t-bad">${a.summary.high} 项高危</span>`}</h2>
        <p class="hint">单章看不出、跨章才现形的问题：译名漂移、名物分歧、音译残留。
          不调 LLM —— 一致性是可枚举的事实。</p>
        <div class="grid g3" style="margin-bottom:12px">
          <div class="step"><div class="k">人名</div><div class="v">${
            a.name_coverage.drifted_entities ?? "—"} 个漂移</div></div>
          <div class="step"><div class="k">名物</div><div class="v">${
            a.lexicon_coverage.drifted_terms ?? "—"} 条分歧</div></div>
          <div class="step"><div class="k">残留</div><div class="v">${
            (a.residue.han_blocks||0)} 段未译</div></div>
        </div>
        ${a.findings.length ? `<div class="tblwrap"><table><thead><tr>
          <th>严重度</th><th>类型</th><th>对象</th><th>说明</th><th>涉及</th>
        </tr></thead><tbody>${a.findings.slice(0,20).map(f=>`<tr>
          <td><span class="tag ${f.severity==='high'?'t-bad':f.severity==='medium'?'t-warn':'t-mute'}">${h(f.severity)}</span></td>
          <td class="mono">${h(f.kind)}</td>
          <td><b>${h(f.subject)}</b></td>
          <td style="color:var(--body)">${h(f.detail)}</td>
          <td class="mono">${f.chapters.length} 章</td>
        </tr>`).join("")}</tbody></table></div>`
        : `<div class="empty">未发现问题</div>`}
      </div>`;
      $("#audit-box").scrollIntoView({behavior:"smooth", block:"nearest"});
    }, "审计中");
  },
  async lock(btn) {
    return run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/prose:lock`,
        {language: State.lang});
      logOk(`锁定 ${r.locked} 段，跳过 ${r.skipped} 段 —— 锁定后重译不会覆盖`);
      App.refresh();
    }, "锁定中");
  },
  async runAll(btn) {
    return run(btn, async () => {
      log("── 一键跑完：分块 → 装置 → 翻译 → 审核 → 回译 → 审计 ──");
      await this.build(null);
      await this.devices(null);
      await this.translate(null);
      await this.review(null);
      await this.backCheck(null);
      await this.audit(null);
      logOk("全部完成");
    }, "执行中");
  },
};

// ───────────────────────── 有声书 ─────────────────────────
const Audio = {
  async render(v) {
    if (!State.chapterId) { v.innerHTML = `<div class="card"><div class="empty">
      请先在「书架」打开一个章节</div></div>`; return; }
    await App.ensureTransform();
    let tl = null;
    try { tl = await api("GET", `/chapters/${State.chapterId}/audiobook`); } catch {}
    v.innerHTML = `
      <div class="card">
        <h2>有声书</h2>
        <p class="hint">译本审核锁定之后再配音。音色来自 voice 素材，
          与分镜配音共用同一套 —— 同一角色在有声书和视频里必须是同一个嗓子。</p>
        <div class="row">
          <button class="btn" onclick="Audio.compile(this)">1 编译音频规格</button>
          <button class="btn pri" onclick="Audio.gen(this)">2 生成 TTS</button>
          <button class="btn" onclick="App.refresh()">刷新时间轴</button>
        </div>
      </div>
      ${tl && tl.segments ? `<div class="card">
        <h2>时间轴 <span class="sub mono" style="color:var(--muted)">
          ${tl.stats.generated}/${tl.stats.segments} 段 ·
          ${(tl.total_duration_ms/1000).toFixed(1)}s</span></h2>
        <p class="hint">${h(tl.notes)}</p>
        <div class="tblwrap"><table><thead><tr>
          <th>#</th><th>类型</th><th>音色</th><th>起点</th><th>时长</th><th>文本</th><th>音频</th>
        </tr></thead><tbody>${tl.segments.map(s=>`<tr>
          <td class="mono">${s.seq_no ?? ""}</td>
          <td><span class="tag t-mute">${h(s.kind)}</span></td>
          <td class="mono" style="color:var(--muted)">${h(s.voice_asset_key||"-")}</td>
          <td class="mono">${(s.start_ms/1000).toFixed(1)}s</td>
          <td class="mono">${s.duration_ms?(s.duration_ms/1000).toFixed(1)+"s":"-"}</td>
          <td style="max-width:340px">${h((s.text||"").slice(0,70))}</td>
          <td>${s.file?`<audio controls preload="none" src="${h(s.file)}"
                 style="height:26px;width:150px"></audio>`:'<span class="tag t-mute">未生成</span>'}</td>
        </tr>`).join("")}</tbody></table></div>
      </div>` : `<div class="card"><div class="empty">还没有音频规格，先执行编译</div></div>`}
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>
    `;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  async compile(btn) {
    if (!State.transformId) return logErr("请先在「世界观」创建映射");
    await run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/audiobook:compile`,
        {transform_id: State.transformId});
      logOk(`编译：旁白 ${r.narration}　对白 ${r.dialogue}`);
      if (r.missing_voice && r.missing_voice.length)
        logWarn(`缺音色素材：${r.missing_voice.join("、")}（会落到旁白音色兜底）`);
      App.refresh();
    }, "编译中");
  },
  async gen(btn) {
    await run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/audiobook:generate`,
        {confirm_cost: true});
      logOk(`TTS 提交 ${r.submitted} 段，预估 $${r.estimated_cost ?? 0}`);
      for (let i = 0; i < 12; i++) {
        await new Promise(r => setTimeout(r, 1500));
        await api("POST", "/gen-tasks:poll-due?limit=200").catch(()=>{});
        const tl = await api("GET", `/chapters/${State.chapterId}/audiobook`).catch(()=>null);
        if (tl && tl.stats.missing === 0) { logOk("全部音频已就绪"); break; }
      }
      App.refresh();
    }, "生成中");
  },
};


// ───────────────────────── 文化梗 ─────────────────────────
const STRATEGY_CN = {
  preserve:"照搬", substitute:"换等价说法", transplant:"换目标文化的梗",
  naturalize:"按目标习惯重写", gloss_inline:"行内轻注", footnote:"脚注",
  compensate:"就近补偿", relocate:"移到别处", omit:"舍弃",
};
const VOL_CN = {evergreen:"长青", decade:"一代人", years:"数年", months:"短命"};
const PLOT_CN = {none:"纯修辞", flavor:"塑造", setup:"伏笔", pivot:"转折"};
const REGISTER_MEME_CN = {
  internet_slang:"网络流行语", subculture:"亚文化黑话", classical_allusion:"典故",
  idiom_proverb:"成语俗语", dialect:"方言", brand_ref:"品牌指涉",
  media_ref:"影视引用", historical_event:"历史事件", social_phenomenon:"社会现象词",
  taboo_euphemism:"委婉禁忌",
};

const Culture = {
  async render(v) {
    if (!State.novelId) {
      v.innerHTML = `<div class="card"><div class="empty">先在「书架」选一本小说</div></div>`;
      return;
    }
    const q = State.transformId ? `?transform_id=${State.transformId}` : "";
    const d = await api("GET", `/novels/${State.novelId}/memes${q}`).catch(()=>null);
    const items = d ? d.items : [];
    v.innerHTML = `
      <div class="card">
        <h2>文化梗
          <span class="sub mono" style="color:var(--muted)">${d?d.total:0} 条</span>
          ${d&&d.unrendered?`<span class="tag t-warn">${d.unrendered} 未定呈现</span>`:""}
          ${d&&d.high_risk?`<span class="tag t-bad">${d.high_risk} 承载情节</span>`:""}
        </h2>
        <p class="hint">收的是<b>字面义不等于实际用法</b>的说法 ——「破防了」字面是防御被击穿，
          实际指情绪失守，直译必错。两者差得越远越该收，差不多的不必收。<br>
          <b>时效</b>决定值不值得费力找等价物：短命梗在源文化里都快消失了，
          不值得目标读者付理解成本。<b>情节承载</b>决定能不能舍：
          伏笔舍了，读者不会觉得「少了个梗」，只会觉得「后面那段莫名其妙」。</p>
        <div class="row" style="margin-bottom:11px">
          <button class="btn" onclick="Culture.extract(this)">从当前章节抽梗</button>
          <button class="btn pri" onclick="Culture.render_(this)"
            ${State.transformId?"":"disabled"}>为目标圈层定呈现</button>
          ${State.transformId?"":`<span class="sub" style="color:var(--warn);font-size:12px">
            先在「映射与词表」选一个世界观映射</span>`}
        </div>
        <div class="tblwrap"><table><thead><tr>
          <th>说法</th><th>类型</th><th>时效</th><th>情节</th>
          <th>实际在说</th><th>目标呈现</th><th>次数</th><th></th>
        </tr></thead><tbody>${
          items.length ? items.map(m => {
            const r = m.rendering;
            const risky = m.plot_load === "setup" || m.plot_load === "pivot";
            return `<tr>
              <td><b>${h(m.surface)}</b>
                ${m.literal_gloss?`<div class="sub" style="color:var(--muted);font-size:11px">
                   字面：${h(m.literal_gloss)}</div>`:""}</td>
              <td><span class="tag t-mute">${h(REGISTER_MEME_CN[m.register]||m.register)}</span></td>
              <td><span class="tag ${m.volatility==="months"?"t-bad":m.volatility==="years"?"t-warn":"t-mute"}">
                ${h(VOL_CN[m.volatility]||m.volatility)}</span></td>
              <td><span class="tag ${risky?"t-warn":"t-mute"}">${h(PLOT_CN[m.plot_load]||m.plot_load)}</span></td>
              <td style="max-width:230px;font-size:12.5px">${h(m.actual_use||"")}</td>
              <td style="min-width:210px">${r ? `
                  <span class="tag t-info">${h(STRATEGY_CN[r.strategy]||r.strategy)}</span>
                  <input value="${h(r.target_text||"")}" id="mr-${r.id}"
                         placeholder="${r.strategy==="omit"?"（舍弃，不译）":"目标说法"}"
                         style="margin-top:5px">
                  ${r.gloss_text?`<div class="sub" style="color:var(--muted);font-size:11px;margin-top:3px">
                     注：${h(r.gloss_text)}</div>`:""}
                  ${r.rationale?`<div class="sub" style="color:var(--muted);font-size:11px;margin-top:3px">
                     ${h(r.rationale)}</div>`:""}
                  ${r.target_volatility&&r.target_volatility!=="evergreen"?`
                     <div class="sub" style="color:var(--warn);font-size:11px;margin-top:3px">
                     ⚠ 目标说法时效为 ${h(VOL_CN[r.target_volatility])}，几年后读者可能不认识</div>`:""}
                ` : `<span class="sub" style="color:var(--muted)">未定</span>`}</td>
              <td class="mono">${m.occurrences||0}</td>
              <td>${r ? (r.locked
                ? `<span class="tag t-ok">已锁定</span>`
                : `<button class="btn sm" onclick="Culture.save('${r.id}',this)">定稿</button>`) : ""}</td>
            </tr>`;
          }).join("")
          : `<tr><td colspan="8" class="empty">还没有抽到文化梗</td></tr>`
        }</tbody></table></div>
      </div>
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  async extract(btn) {
    if (!State.chapterId) return logErr("先在「书架」选一个章节");
    await run(btn, async () => {
      const r = await api("POST", `/chapters/${State.chapterId}/memes:extract`, {});
      logOk(`新增 ${r.memes} 条，累积 ${r.updated} 条`);
      (r.high_risk||[]).forEach(x =>
        logWarn(`承载情节：${x.surface}（${PLOT_CN[x.plot_load]||x.plot_load}）`));
      App.refresh();
    }, "抽取中");
  },
  async render_(btn) {
    await run(btn, async () => {
      const r = await api("POST", `/transforms/${State.transformId}/memes:render`, {});
      logOk(`定呈现 ${r.rendered} 条　${JSON.stringify(r.by_strategy)}`);
      (r.needs_review||[]).forEach(x => logWarn(`${x.surface}：${x.reason}`));
      App.refresh();
    }, "生成中");
  },
  async save(id, btn) {
    const el = $(`#mr-${id}`);
    await run(btn, async () => {
      await api("PATCH", `/meme-renderings/${id}`,
                {target_text: (el?el.value:"").trim(), locked: true});
      logOk("已定稿"); App.refresh();
    }, "保存");
  },
};

// ───────────────────────── 文化差异审查 ─────────────────────────
const GAP_CN = {
  humor_lost:"笑点丢失", emotion_flattened:"情绪抹平", register_mismatch:"语体错位",
  relation_lost:"关系丢失", subtext_lost:"言外之意丢失", allusion_opaque:"典故读不懂",
  meme_untranslated:"梗直译了", cultural_assumption:"缺文化前提",
  anachronism:"年代错置", taboo_shift:"禁忌错位", pacing_shift:"节奏改变",
  overtranslation:"过度解释",
};
const CHANNEL_CN = {
  lexicon:"名物词表", appellation:"称呼表", meme:"梗表",
  device:"叙事装置", retranslate:"整段重译", manual:"人工",
};

const Review = {
  async render(v) {
    if (!State.chapterId) {
      v.innerHTML = `<div class="card"><div class="empty">先在「书架」选一个章节</div></div>`;
      return;
    }
    const list = await api("GET", `/chapters/${State.chapterId}/culture-reviews`)
      .catch(()=>({items:[]}));
    const latest = (list.items||[])[0];
    const detail = latest
      ? await api("GET", `/culture-reviews/${latest.id}`).catch(()=>null) : null;

    v.innerHTML = `
      <div class="card">
        <h2>文化差异审查</h2>
        <p class="hint">这里问的不是「翻得对不对」，是<b>「两边的读者各自得到了什么」</b>。
          问对不对，模型会去比对字面然后告诉你「忠实准确」；
          问读者得到什么，它才会去想那句话在两个文化里各自激起什么反应 ——
          落差就是要找的东西。<br>
          报表<b>不会自动改译文</b>。每条要你裁决：同意 / 修改 / 补充 / 驳回，
          裁完再一并落地。锁定过的块不会被覆盖。</p>
        <div class="row">
          <button class="btn pri" onclick="Review.run(this)">跑一次审查</button>
          <select id="rv-tier" style="width:auto;min-width:150px">
            <option value="">默认档位（critical）</option>
            <option value="premium">premium</option>
            <option value="standard">standard</option>
          </select>
          ${detail && detail.pending ? `<button class="btn" onclick="Review.apply(this)">
             应用已裁决（${detail.findings.filter(f=>
               ["accepted","modified","supplemented"].includes(f.verdict) && !f.applied
             ).length} 条）</button>` : ""}
        </div>
      </div>
      ${detail ? `
      <div class="card">
        <div class="steps">
          <div class="step ${detail.fidelity_score>=80?"done":detail.fidelity_score<60?"blocked":""}">
            <div class="k">体验还原度</div><div class="v">${detail.fidelity_score ?? "—"}</div></div>
          <div class="step"><div class="k">发现</div><div class="v">${detail.findings_total}</div></div>
          <div class="step ${detail.pending?"blocked":"done"}">
            <div class="k">待裁决</div><div class="v">${detail.pending}</div></div>
          <div class="step"><div class="k">已落地</div><div class="v">${detail.resolved_total}</div></div>
          <div class="step"><div class="k">档位</div><div class="v" style="font-size:13px">
            ${h(detail.tier)}</div></div>
        </div>
        ${detail.summary?`<p class="hint" style="margin-top:4px">${h(detail.summary)}</p>`:""}
        <div class="row" style="gap:5px">${
          Object.entries(detail.by_kind||{}).map(([k,n])=>
            `<span class="tag t-mute">${h(GAP_CN[k]||k)} ${n}</span>`).join("")
        }</div>
      </div>
      ${detail.findings.map(f => Review.card(f)).join("")}
      ` : `<div class="card"><div class="empty">还没有审查记录</div></div>`}
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },

  card(f) {
    const judged = f.verdict !== "pending";
    return `<div class="gap ${f.applied?"done":""}">
      <div class="gh">
        <span class="sev sev-${f.severity}">${f.severity}</span>
        <b style="color:var(--ink)">${h(GAP_CN[f.kind]||f.kind)}</b>
        ${f.fix_channel?`<span class="tag t-mute">修在：${h(CHANNEL_CN[f.fix_channel]||f.fix_channel)}</span>`:""}
        ${f.applied?`<span class="tag t-ok">已落地</span>`
          : judged?`<span class="tag t-info">${h({accepted:"已同意",modified:"已修改",
              supplemented:"已补充",rejected:"已驳回"}[f.verdict]||f.verdict)}</span>`:""}
      </div>
      <div class="pair">
        <div><div class="k">原文</div>${h(f.source||"")}</div>
        <div><div class="k">译文</div>${h(f.target||"")}</div>
      </div>
      ${f.source_effect?`<div class="eff"><b>中文读者得到</b>：${h(f.source_effect)}</div>`:""}
      ${f.target_effect?`<div class="eff"><b>目标读者得到</b>：${h(f.target_effect)}</div>`:""}
      <div class="eff" style="color:var(--warn)"><b>落差</b>：${h(f.gap)}</div>
      ${f.proposal?`<div class="prop"><b>方案</b>：${h(f.proposal)}
        ${f.proposed_text?`<div style="margin-top:6px;font-family:var(--mono);font-size:12px">
          ${h(f.proposed_text)}</div>`:""}</div>`:""}
      ${f.applied?"":`
        <textarea id="hv-${f.id}" rows="2"
          placeholder="修改或补充时写在这里（裁决为「修改」「补充」时必填）">${h(f.human_text||"")}</textarea>
        <div class="acts">
          <button class="btn sm pri" onclick="Review.judge('${f.id}','accepted',this)">同意</button>
          <button class="btn sm" onclick="Review.judge('${f.id}','modified',this)">按我写的改</button>
          <button class="btn sm" onclick="Review.judge('${f.id}','supplemented',this)">补充</button>
          <button class="btn sm danger" onclick="Review.judge('${f.id}','rejected',this)">驳回</button>
        </div>`}
    </div>`;
  },

  async run(btn) {
    const tier = ($("#rv-tier")||{}).value || null;
    await run(btn, async () => {
      const r = await api("POST",
        `/chapters/${State.chapterId}/culture-review/${State.lang}:run`, {tier});
      logOk(`发现 ${r.findings} 处差异　体验还原度 ${r.fidelity_score ?? "—"}`);
      (r.top||[]).slice(0,5).forEach(x =>
        logWarn(`[${x.severity}] ${GAP_CN[x.kind]||x.kind}：${x.gap}`));
      App.refresh();
    }, "审查中");
  },
  async judge(id, verdict, btn) {
    const el = $(`#hv-${id}`);
    const text = (el ? el.value : "").trim();
    if ((verdict === "modified" || verdict === "supplemented") && !text)
      return logErr("裁决为「修改」或「补充」时必须写出文本，否则应用时无内容可用");
    await run(btn, async () => {
      await api("PATCH", `/culture-findings/${id}`,
                {verdict, human_text: text || null});
      logOk(`已裁决：${verdict}`); App.refresh();
    }, "提交");
  },
  async apply(btn) {
    const list = await api("GET", `/chapters/${State.chapterId}/culture-reviews`);
    const rid = (list.items||[])[0] ? (list.items||[])[0].id : null;
    if (!rid) return logErr("没有可应用的审查");
    await run(btn, async () => {
      const r = await api("POST", `/culture-reviews/${rid}:apply`, {});
      logOk(`落地 ${r.applied} 条`);
      if (r.locked) logWarn(`${r.locked} 条因目标块已锁定未覆盖`);
      (r.skipped||[]).forEach(x => logWarn(`跳过：${x.reason}`));
      App.refresh();
    }, "应用");
  },
};

const POS_CN = {
  far_left:"最左", left:"左", center_left:"中偏左", center:"中央",
  center_right:"中偏右", right:"右", far_right:"最右",
  foreground:"前景", background:"背景", offscreen:"画外",
};
const FACING_CN = {
  to_camera:"正脸", away:"背影", profile_left:"左侧脸",
  profile_right:"右侧脸", three_quarter:"四分之三侧",
};
const ROLE_CN = {
  speaker:"说话", addressee:"被对说", listener:"旁听", silent:"在场", absent:"不在场",
};

const Staging = {
  async render(v) {
    if (!State.chapterId) {
      v.innerHTML = `<div class="card"><div class="empty">先在「书架」选一个章节</div></div>`;
      return;
    }
    const plan = await api("GET", `/chapters/${State.chapterId}/shot-plan`).catch(()=>null);
    const pid = plan && plan.plan_id;
    const d = pid ? await api("GET", `/shot-plans/${pid}/performance`).catch(()=>null) : null;

    v.innerHTML = `
      <div class="card">
        <h2>分镜调度
          ${d?`<span class="sub mono" style="color:var(--muted)">${d.with_cast}/${d.shots} 镜有调度</span>`:""}
          ${d&&d.static_shots.length?`<span class="tag t-warn">${d.static_shots.length} 镜首尾相同</span>`:""}
          ${d&&d.position_jumps.length?`<span class="tag t-bad">${d.position_jumps.length} 处站位跳变</span>`:""}
        </h2>
        <p class="hint">剧本层知道<b>谁在说</b>，不知道<b>对谁说</b> ——
          而镜头该给谁、给几个人，靠的是后者。<br>
          这里抽的是<b>瞬时状态</b>（站哪、看谁、什么表情、在做什么），
          与素材包的恒定属性（长什么样、穿什么）分开存 ——
          混在一起的话「他握紧了剑」会污染角色素材，下一镜松了手也还是攥着的。<br>
          两个告警各有含义：<b>首尾相同</b>意味着这一镜生成出来是两张静止的画，
          首尾之差才是运动；<b>站位跳变</b>是同一角色在相邻镜里位置突变而中间没有走位，
          动画到这里会穿帮。</p>
        <div class="row">
          <button class="btn" onclick="Staging.dialogue(this)">标注对话指向与在场</button>
          <button class="btn pri" onclick="Staging.extract(this)" ${pid?"":"disabled"}
            >抽取镜头表演</button>
          ${pid?"":`<span class="sub" style="color:var(--warn);font-size:12px">
            先在「剧本转换」生成分镜计划</span>`}
        </div>
      </div>
      ${d && d.items.length ? d.items.map(s => `
        <div class="card" style="padding:13px 15px">
          <div class="row" style="margin-bottom:${s.cast.length?"9px":"0"}">
            <span class="tag t-mute">#${s.order_no}</span>
            <span class="tag t-info">${h(s.shot_size||"—")}</span>
            <span class="mono" style="color:var(--muted);font-size:12px">
              ${(s.duration_ms/1000).toFixed(1)}s</span>
            ${s.static?`<span class="tag t-warn">首尾相同</span>`:""}
            <span style="color:var(--body);font-size:12.5px">${h(s.description||"")}</span>
          </div>
          ${s.cast.length ? `<div class="tblwrap"><table><thead><tr>

  async extract(btn) {
    const plan = await api("GET", `/chapters/${State.chapterId}/shot-plan`);
    await run(btn, async () => {

// ───────────────────────── 提示词台账 ─────────────────────────
const KIND_CN = {

  style:"风格", voice:"音色", sfx:"音效", bgm:"配乐", room_tone:"环境声",
};

const Prompts = {
  async render(v) {
    if (!State.transformId) {

      + (kind || q ? `?${kind?`kind=${encodeURIComponent(kind)}&`:""}${q?`q=${encodeURIComponent(q)}`:""}` : "");

          <span class="sub mono" style="color:var(--muted)">${d.with_prompt}/${d.total}</span>
          ${d.missing_prompt?`<span class="tag t-warn">${d.missing_prompt} 缺提示词</span>`:""}

          一个道具的描述改了，可能连带十几个镜头的画面全变，而改的人完全不知情。<br>

          <b>依据的原文</b>（为什么是这样）、<b>被谁引用</b>（改了会影响什么）。<br>

          <div class="gap" style="margin-bottom:8px">

              <span style="color:var(--muted)">→</span>
              <span style="color:var(--accent)">${h(i.target_name||"（未定形）")}</span>
              <span class="tag ${i.status==="locked"?"t-ok":i.status==="missing"?"t-bad":"t-mute"}"

              ${(i.missing_fields||[]).length
                ? `<span class="tag t-warn">缺 ${i.missing_fields.join("、")}</span>`:""}
              <span class="mono" style="color:var(--muted);font-size:11px;margin-left:auto"
                >${i.prompt_chars} 字</span>
            </div>
            ${i.visual_prompt ? `
              <textarea id="pp-${i.variant_id}" rows="2"
                style="font-family:var(--mono);font-size:12px">${h(i.visual_prompt)}</textarea>
              ${i.negative_prompt?`<div class="sub mono" style="color:var(--danger);font-size:11px;margin-top:4px">
                negative: ${h(i.negative_prompt)}</div>`:""}

                <button class="btn sm" onclick="Prompts.save('${i.variant_id}',this)">保存</button>
              </div>

            ${(i.evidence||[]).length ? `
              <details style="margin-top:7px">
                <summary style="cursor:pointer;color:var(--muted);font-size:11.5px">

  setQ(v) { this.q = (v||"").trim(); App.refresh(); },

    const el = $(`#pp-${vid}`);

};

const CT_CN = {

  prop_vanished:"道具消失", prop_appeared:"道具凭空出现",
};

const Crew = {
  async render(v) {
    if (!State.chapterId) {
      v.innerHTML = `<div class="card"><div class="empty">先在「书架」选一个章节</div></div>`;
      return;
    }
    const plan = await api("GET", `/chapters/${State.chapterId}/shot-plan`).catch(()=>null);
    const pid = plan && plan.shot_plan_id;
    const [d, ct] = pid ? await Promise.all([
      api("GET", `/shot-plans/${pid}/crew-sheets`).catch(()=>null),
      api("GET", `/shot-plans/${pid}/continuity`).catch(()=>null),
    ]) : [null, null];

    v.innerHTML = `
      <div class="card">
        <h2>镜头制作单
          ${d?`<span class="sub mono" style="color:var(--muted)">${d.complete}/${d.shots} 完整</span>`:""}
          ${d&&d.with_motion?`<span class="tag t-ok">${d.with_motion} 镜有运动</span>`:""}
        </h2>
        <p class="hint">这是本系统对下游（图像／视频／音频生成）的<b>主要交付物</b>。
          本系统不生成画面与声音，但要把「该生成什么」说到不留空白 ——
          否则那些模块只能自己猜，猜出来的东西没法跨镜保持一致。<br>
          按工种分开出单而不是一次填完：这些维度的判据完全不同 ——
          灯光要方位与光质，剪辑要秒数与切点，一次填完模型会平均用力、每项写两句。<br>
          <b>缺项是验收结果不是警告</b>：下游拿到「柔和侧光」出来的图没法用，
          而那时已经花掉了图像模型的钱。</p>
        <div class="row">
          <button class="btn pri" onclick="Crew.gen(this)" ${pid?"":"disabled"}>逐工种出单</button>
          <button class="btn" onclick="Crew.motion(this)" ${pid?"":"disabled"}>生成运动描述</button>
          ${pid?"":`<span class="sub" style="color:var(--warn);font-size:12px">
            先在「剧本转换」生成分镜计划</span>`}
        </div>
      </div>

      ${ct ? `<div class="card">
        <h2>场记 · 跨镜连续性
          ${ct.total ? `<span class="tag t-bad">${ct.total} 处</span>`
                     : `<span class="tag t-ok">未发现问题</span>`}
          <span class="sub mono" style="color:var(--muted)">${ct.shots} 镜 / ${ct.scenes} 场</span>
        </h2>
        <p class="hint">这类错误<b>每一镜自己都完全合理</b> ——
          主光从左前打过来没问题，下一镜从右前打过来也没问题，
          可放在同一场戏里，观众会觉得太阳在两秒里转了半圈。<br>
          四类都是形式化判定，<b>不调模型</b>：光位与色温跳变、翻轴、
          视线不相向、道具凭空出现或消失。</p>
        ${ct.items.length ? ct.items.map(i=>`
          <div class="gap" style="margin-bottom:7px">
            <div class="gh">
              <span class="sev sev-${i.severity==="high"?5:i.severity==="medium"?3:1}"
                >${i.severity==="high"?"高":i.severity==="medium"?"中":"低"}</span>
              <b style="color:var(--ink)">${h(CT_CN[i.kind]||i.kind)}</b>
              <span class="tag t-mute">镜 ${i.shot_from}${
                i.shot_to!==i.shot_from?` → ${i.shot_to}`:""}</span>
              ${(i.subjects||[]).map(s=>`<span class="tag t-info">${h(s)}</span>`).join("")}
            </div>
            <div class="eff">${h(i.detail)}</div>
          </div>`).join("") : ""}
        ${(ct.not_checked||[]).length ? `
          <div class="sub" style="color:var(--warn);font-size:12px;margin-top:8px">
            <b>以下没能检查</b> —— 报「0 处问题」会让人以为查过了：<br>
            ${ct.not_checked.map(h).join("<br>")}</div>` : ""}
      </div>` : ""}

      ${d && d.items.length ? d.items.map(s => `
        <div class="card" style="padding:13px 15px">
          <div class="row" style="margin-bottom:9px">
            <span class="tag t-mute">#${s.order_no}</span>
            <span class="tag t-info">${h(s.shot_size||"—")}</span>
            <span class="mono" style="color:var(--muted);font-size:12px">
              ${(s.duration_ms/1000).toFixed(1)}s</span>
            ${(s.missing_roles||[]).length
              ? `<span class="tag t-warn">缺 ${s.missing_roles.map(r=>CREW_CN[r]||r).join("、")}</span>`
              : `<span class="tag t-ok">五工种齐</span>`}
            <span style="color:var(--body);font-size:12.5px">${h(s.description||"")}</span>
          </div>
          ${Object.entries(s.sheets).map(([role, sh])=>`
            <div style="margin-bottom:7px">
              <div class="row" style="gap:6px;margin-bottom:3px">
                <span class="tag ${sh.missing.length?"t-warn":"t-mute"}">${h(CREW_CN[role]||role)}</span>
                ${sh.missing.length?`<span class="sub" style="color:var(--warn);font-size:11px">
                  缺 ${sh.missing.map(h).join("、")}</span>`:""}
                ${sh.rejected.length?`<span class="sub" style="color:var(--danger);font-size:11px">
                  空洞 ${sh.rejected.length} 处</span>`:""}
                ${sh.edited_by_human?`<span class="tag t-ok">已改</span>`:""}
              </div>
              <div class="sub" style="font-size:12px;color:var(--body);line-height:1.6">
                ${h(sh.prompt||"—")}</div>

          ${s.motion ? `
            <div class="prop" style="margin-top:8px">
              <b>运动</b>　${h(s.motion.camera_move||"—")}　${h(s.motion.pacing||"")}
              <div class="sub" style="font-size:12px;margin-top:5px">
                起幅：${h((s.motion.start_frame||"").slice(0,90))}<br>
                落幅：${h((s.motion.end_frame||"").slice(0,90))}</div>
              ${(s.motion.deltas||[]).length?`<div class="sub" style="font-size:12px;margin-top:4px">
                首尾差异（i2i 的直接依据）：${s.motion.deltas.map(h).join("；")}</div>`:""}
            </div>` : ""}
        </div>`).join("")
      : `<div class="card"><div class="empty">${pid?"还没有制作单":"还没有分镜计划"}</div></div>`}
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  async _plan() {
    const p = await api("GET", `/chapters/${State.chapterId}/shot-plan`);
    return p.shot_plan_id;
  },
  async gen(btn) {
    await run(btn, async () => {
      const pid = await this._plan();
      const r = await api("POST", `/shot-plans/${pid}/crew-sheets:generate`, {});
      logOk(`出单 ${r.generated} 份　${JSON.stringify(r.by_role)}`);
      (r.incomplete||[]).forEach(x =>
        logWarn(`镜 ${x.shot} ${CREW_CN[x.role]||x.role}：缺 ${x.missing.join("、")}`));
      App.refresh();
    }, "出单中");
  },
  async motion(btn) {
    await run(btn, async () => {
      const pid = await this._plan();
      const r = await api("POST", `/shot-plans/${pid}/motion:generate`, {});
      logOk(`运动 ${r.generated}/${r.shots} 镜`);
      (r.thin||[]).forEach(x => logWarn(`镜 ${x.shot}：${x.why}`));
      App.refresh();
    }, "生成中");
  },
};

        ${d.not_checked.length?`<div class="sub"
