          <div class="row" style="margin-bottom:8px">
            <b style="color:var(--ink);font-size:14px">${h(i.name)}</b>
            <span class="tag t-mute">出场 ${i.appear_chapters} 章</span>
            <span class="tag ${i.epochs.length>1?"t-info":"t-mute"}"
              >${i.epochs.length} 期</span>
            ${i.identity_ref?`<span class="tag t-ok">脸参考已定</span>`
              :`<span class="tag t-warn">无脸参考</span>`}
          </div>
          ${Object.keys(i.invariant||{}).length?`
            <div class="prop" style="margin-bottom:8px">
              <b>跨期不变</b>　<span class="sub" style="font-size:11px;color:var(--muted)">
                逐字复用，不重新描述 —— 同一性的锚只能有一个来源</span>
              <div class="sub" style="font-size:12px;margin-top:4px;line-height:1.7">
                ${Object.entries(i.invariant).map(([k,val])=>
                  `<span style="color:var(--muted)">${h(EI_CN[k]||k)}</span> ${h(val)}`
                ).join("　")}</div>
            </div>`:""}
          ${i.epochs.map(e=>`
            <div style="margin-bottom:8px">
              <div class="row" style="gap:6px;margin-bottom:3px">
                <span class="tag t-info">${e.from_chapter_order}–${
                  e.to_chapter_order||"末"} 章</span>
                <b style="color:var(--ink);font-size:12.5px">${h(e.display_name)}</b>
                <span class="tag t-mute">${h(EK_CN[e.kind]||e.kind)}</span>
                ${e.locked?`<span class="tag t-ok">锁定</span>`:""}
              </div>
              ${e.trigger?`<div class="sub" style="font-size:12px;color:var(--body)">
                <span style="color:var(--muted)">触发</span> ${h(e.trigger)}</div>`:""}
              <div class="sub" style="font-size:12px;line-height:1.7;margin-top:2px">
                ${Object.entries(e.variant||{}).map(([k,val])=>
                  `<span style="color:var(--muted)">${h(EV_CN[k]||k)}</span> ${h(val)}`
                ).join("　")||"—"}</div>
            </div>`).join("")}
        </div>`).join("")
      : `<div class="card"><div class="empty">${
          pid?"还没划分时期":"还没有世界观映射"}</div></div>`}
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  async mine(btn, force) {
    await run(btn, async () => {
      const ts = await api("GET", `/novels/${State.novelId}/transforms`);
      const tf = ts.find(t=>t.id===State.transformId) || ts[0];
      if (!tf) throw new Error("还没有世界观映射");
      const r = await api("POST",
        `/novels/${State.novelId}/entity-epochs:mine?profile_id=${tf.target.id}`,
        {force: !!force});
      logOk(`${r.entities} 人 ${r.epochs} 期　配角不分期 ${r.skipped_minor.length} 人`);
      (r.rule_fixes||[]).forEach(x =>
        log(`规则：${x.entity||""} ${x.detail}`, "warn"));
      (r.failed||[]).forEach(x => logWarn(x));
      App.refresh();
    }, "划分中");
  },
};

// ───────────────────────── 配音表 ─────────────────────────
const VF_CN = {voice_type:"声部", pitch:"音区", texture:"音质", resonance:"共鸣",
               accent:"口音", age_feel:"年龄感", tempo:"语速", energy:"力度",
               condition:"状态"};
const VF_ID = ["voice_type","pitch","texture","resonance","accent"];
const VF_EP = ["age_feel","tempo","energy","condition"];

const Casting = {
  async render(v) {
    if (!State.novelId) {
      v.innerHTML = `<div class="card"><div class="empty">先在「书架」选一本小说</div></div>`;
      return;
    }
    const transforms = await api("GET", `/novels/${State.novelId}/transforms`)
      .catch(()=>[]);
    const tf = transforms.find(t=>t.id===State.transformId) || transforms[0];
    const pid = tf && tf.target && tf.target.id;
    const d = pid ? await api(
      "GET", `/novels/${State.novelId}/casting?profile_id=${pid}`).catch(()=>null)
      : null;
    const a = d && d.audit;

    v.innerHTML = `
      <div class="card">
        <h2>配音表
          ${d?`<span class="sub mono" style="color:var(--muted)">${
            a.cast}/${a.speaking_roles+1} 已配</span>`:""}
          ${a&&a.epoch_rows?`<span class="tag t-info">${a.epoch_rows} 条时期音色</span>`:""}
          ${a?(a.collisions.length
             ? `<span class="tag t-bad">${a.collisions.length} 处撞声</span>`
             : `<span class="tag t-ok">音色可辨</span>`):""}
        </h2>
        <p class="hint">全片同一个角色必须是同一个嗓子 —— 换了观众会当成换了人。<br>
          <b>整本一起配，不是遇到一个配一个</b>：可辨识是角色之间的关系，
          不是单个角色的属性。一次配一个的话每一个单看都合格，
          放在一起五个人同一把嗓子。<br>
          存的是<b>声学描述而不是某家引擎的 voice_id</b> ——
          存了 voice_id 当权威，换 TTS 时全书要重配，等于换了一套演员。
          落到 qwen3-tts 或云 API 是最后一步，描述本身不动。</p>
        <div class="row">
          <button class="btn pri" onclick="Casting.run(this)" ${pid?"":"disabled"}
            >整本配音</button>
          <button class="btn" onclick="Casting.epochs(this)" ${pid?"":"disabled"}
            >按时期推导</button>
          <button class="btn" onclick="Casting.run(this,true)" ${pid?"":"disabled"}
            >重配（不覆盖已锁定）</button>
          ${tf?`<span class="sub mono" style="color:var(--muted);font-size:12px">
            ${h(tf.target.display_name)}</span>`:`<span class="sub"
            style="color:var(--warn);font-size:12px">先在「映射与词表」建一个映射</span>`}
        </div>
      </div>

      ${a && (a.collisions.length || a.identity_drift.length
              || a.uncast.length || a.incomplete.length || a.not_checked.length) ? `
      <div class="card">
        <h2>体检</h2>
        ${a.collisions.length?`<p class="hint" style="margin-bottom:6px">
          <b>撞声</b> —— 同场说过话的角色之间用严格阈值，其余用宽阈值。
          全书两两互斥既做不到也没必要：第三章的店小二和第二十章的船夫
          永远不会同框。</p>`:""}
        ${a.collisions.map(c=>`
          <div class="gap" style="margin-bottom:7px">
            <div class="gh">
              <span class="sev sev-${c.scope==="same_scene"?5:2}"
                >${c.scope==="same_scene"?"同场":"全书"}</span>
              <b style="color:var(--ink)">${h(c.left)} × ${h(c.right)}</b>
              <span class="tag t-mute">${c.score}/${c.threshold}</span>
              ${c.where?`<span class="tag t-info">${h(c.where)}</span>`:""}
            </div>
            <div class="eff">${h(c.detail)}</div>
          </div>`).join("")}
        ${a.identity_drift.map(i=>`
          <div class="gap" style="margin-bottom:7px">
            <div class="gh"><span class="sev sev-4">声线漂移</span>
              <b style="color:var(--ink)">${h(i.entity)}</b></div>
            <div class="eff">${h(i.detail)}</div>
          </div>`).join("")}
        ${a.incomplete.length?`<div class="sub" style="font-size:12px;margin-top:6px">
          <b style="color:var(--warn)">取值有问题</b>：${a.incomplete.map(x=>
            `${h(x.entity)}（${x.problems.map(h).join("、")}）`).join("　")}</div>`:""}
        ${a.uncast.length?`<div class="sub" style="font-size:12px;margin-top:6px">
          <b style="color:var(--warn)">说了话但没配音色</b>：${a.uncast.map(h).join("、")}
          <br>对白<b>不会</b>回落到旁白的嗓子 —— 借旁白的嗓子说台词，
          数据上看不出问题，听起来却是旁白在自问自答。宁可缺，也不要错。</div>`:""}
        ${a.not_checked.length?`<div class="sub"
          style="color:var(--warn);font-size:12px;margin-top:8px">
          <b>以下没能检查</b> —— 报「0 处问题」会让人以为查过了：<br>
          ${a.not_checked.map(h).join("<br>")}</div>`:""}
      </div>` : ""}

      ${d && d.items.length ? `<div class="card">
        <h2>音色 <span class="sub mono" style="color:var(--muted)">
          声部/音区/音质/共鸣/口音跨时期恒定，年龄感/语速/力度/状态随时期变</span></h2>
        <table><thead><tr>
          <th>角色</th><th>时期</th><th>台词</th>
          ${VF_ID.map(f=>`<th>${VF_CN[f]}</th>`).join("")}
          ${VF_EP.map(f=>`<th>${VF_CN[f]}</th>`).join("")}
          <th>TTS</th><th></th>
        </tr></thead><tbody>
        ${d.items.map(i=>`<tr>
          <td><b>${h(i.name)}</b></td>
          <td><span class="tag ${i.epoch_key==="baseline"?"t-mute":"t-info"}"
            >${h(i.epoch_key)}</span></td>
          <td class="mono" style="color:var(--muted)">${i.lines||""}</td>
          ${VF_ID.map(f=>`<td>${h(i.timbre[f]||"—")}</td>`).join("")}
          ${VF_EP.map(f=>`<td class="sub">${h(i.timbre[f]||"—")}</td>`).join("")}
          <td class="mono" style="font-size:11px;color:var(--muted)">
            ${i.tts_params.gender||""} ${
            i.tts_params.pitch_shift>0?"+":""}${i.tts_params.pitch_shift??""} ×${
            i.tts_params.rate??""}</td>
          <td>${i.locked?`<span class="tag t-ok">锁定</span>`:
              i.edited_by_human?`<span class="tag t-info">已改</span>`:""}</td>
        </tr>
        ${i.rationale||i.speech_habits?`<tr><td></td><td colspan="12"
          class="sub" style="font-size:12px;color:var(--body);padding-top:0">
          ${i.speech_habits?`<b>说话习惯</b> ${h(i.speech_habits)}　`:""}
          ${i.rationale?`<span style="color:var(--muted)">${h(i.rationale)}</span>`:""}
        </td></tr>`:""}`).join("")}
        </tbody></table>
      </div>` : `<div class="card"><div class="empty">${
        pid?"还没有配音表":"还没有世界观映射"}</div></div>`}
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  async _profile() {
    const ts = await api("GET", `/novels/${State.novelId}/transforms`);
    const tf = ts.find(t=>t.id===State.transformId) || ts[0];
    if (!tf) throw new Error("还没有世界观映射");
    return tf.target.id;
  },
  async run(btn, force) {
    await run(btn, async () => {
      const r = await api("POST", `/novels/${State.novelId}/casting:run`,
        {profile_id: await this._profile(), force: !!force});
      logOk(`配音 ${r.cast} 个　沿用 ${r.reused}　锁定跳过 ${r.skipped_locked}`);
      (r.resolved||[]).forEach(x => log(`规则消解：${x.detail}`, "warn"));
      (r.collisions||[]).forEach(x => logWarn(`仍撞声：${x.detail}`));
      (r.invalid||[]).forEach(x => logWarn(
        `${x.entity}：${[...(x.off_vocab||[]),...(x.missing||[])].join("、")}`));
      App.refresh();
    }, "配音中");
  },
  async epochs(btn) {
    await run(btn, async () => {
      const pid = await this._profile();
      const r = await api("POST",
        `/novels/${State.novelId}/casting:derive-epochs?profile_id=${pid}`, {});
      logOk(`时期音色 ${r.derived} 条（共 ${r.epochs} 期），不调模型`);
      App.refresh();
    }, "推导中");
  },
};

// ───────────────────────── 任务 ─────────────────────────
const Tasks = {
  async render(v) {
    const [sum, list] = await Promise.all([
      api("GET", "/gen-tasks/summary"),
      api("GET", "/gen-tasks?size=40"),
    ]);
    v.innerHTML = `
      <div class="steps">
        ${["queued","submitted","running","succeeded","failed"].map(k=>`
          <div class="step ${k==='failed'&&sum.by_status[k]?'blocked':k==='succeeded'?'done':''}">
            <div class="k">${k}</div><div class="v">${sum.by_status[k]||0}</div></div>`).join("")}
        <div class="step"><div class="k">累计成本</div><div class="v">$${sum.total_cost}</div></div>
      </div>
      <div class="card">
        <div class="row" style="margin-bottom:11px">
          <button class="btn" onclick="Tasks.poll(this)">轮询到期任务</button>
          <span class="hint" style="margin:0">回调会丢（上游重试耗尽、网络抖动、服务重启），
            轮询是契约里的兜底。</span>
        </div>
        <div class="tblwrap"><table><thead><tr>
          <th>能力</th><th>状态</th><th>厂商</th><th>模型</th><th>引用</th><th>成本</th><th>错误</th>
        </tr></thead><tbody>${
          (list.items||[]).map(t=>`<tr>
            <td class="mono">${h(t.capability)}</td>
            <td><span class="tag ${t.status==='succeeded'?'t-ok':t.status==='failed'?'t-bad':'t-warn'}">${h(t.status)}</span></td>
            <td class="mono" style="color:var(--muted)">${h(t.provider||"-")}</td>
            <td class="mono" style="color:var(--muted)">${h(t.model||"-")}</td>
            <td class="mono" style="color:var(--muted)">${h(t.ref_kind||"-")}</td>
            <td class="mono">${t.usage&&t.usage.cost!=null?"$"+t.usage.cost:"-"}</td>
            <td style="color:var(--danger);font-size:12px">${h((t.error||{}).message||"")}</td>
          </tr>`).join("")
        }</tbody></table></div>
      </div>
      <div class="card"><h2>运行日志</h2><div class="log" id="log"></div></div>`;
    const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
  },
  async poll(btn) {
    await run(btn, async () => {
      let total = 0;
      for (let i=0;i<5;i++) {
        const r = await api("POST", "/gen-tasks:poll-due?limit=200");
        total += r.settled;
        if (!r.checked) break;
        await new Promise(x=>setTimeout(x,800));
      }
      logOk(`轮询结清 ${total} 个任务`); App.refresh();
    }, "轮询中");
  },
};

// ───────────────────────── App ─────────────────────────
const App = {
  async boot() {
    const shut = new Set(JSON.parse(localStorage.getItem("nav.shut") || "[]"));
    $("#nav").innerHTML = GROUPS.map(g => `
      <div class="navgrp ${shut.has(g.id) ? "shut" : ""}" id="${g.id}">
        <button class="gh" onclick="App.toggleGroup('${g.id}')">
          ${h(g.name)}<span class="caret">▼</span></button>
        <div class="items"><div>${g.pages.map(p => `
          <button class="item" data-p="${p.id}" onclick="App.go('${p.id}')" title="${h(p.sub)}">
            <span class="ico">${p.ico}</span><span class="lbl">${h(p.name)}</span>
            <span class="navbadge hide" id="badge-${p.id}"></span>
          </button>`).join("")}</div></div>
      </div>`).join("");
    if (localStorage.getItem("nav.collapsed") === "1")
      $(".app").classList.add("collapsed");
    await this.health();
    setInterval(() => this.health(), 20000);
    setInterval(() => this.badge(), 6000);
    await this.refresh();
  },
  go(id) { State.page = id; State.save(); this.refresh(); },

  toggleGroup(gid) {
    const el = document.getElementById(gid);
    if (!el) return;
    el.classList.toggle("shut");
    const shut = [...document.querySelectorAll(".navgrp.shut")].map(x => x.id);
    localStorage.setItem("nav.shut", JSON.stringify(shut));
  },

  toggleSide() {
    const on = $(".app").classList.toggle("collapsed");
    localStorage.setItem("nav.collapsed", on ? "1" : "0");
  },

  /** 校验并修复本地记住的 transformId。
   *  localStorage 里的 id 会因数据被删或换小说而失效，
   *  失效后页面只会报 404，用户看不出该去哪补。这里静默自愈。 */
  async ensureTransform() {
    if (!State.novelId) return;
    let list = [];
    try { list = await api("GET", `/novels/${State.novelId}/transforms`); }
    catch { return; }
    if (State.transformId && list.some(t => t.id === State.transformId)) return;
    const pick = list.find(t => t.target_language_code === State.lang && t.status === "active")
              || list.find(t => t.status === "active")
              || list[0];
    State.transformId = pick ? pick.id : "";
    if (pick) State.lang = pick.target_language_code;
    State.save();
  },
  async refresh() {
    const p = PAGES.find(x => x.id === State.page) || PAGES[0];
    $("#page-title").textContent = p.name;
    $("#page-sub").textContent = p.sub;
    document.querySelectorAll("#nav button").forEach(b =>
      b.classList.toggle("on", b.dataset.p === p.id));
    const v = $("#view");
    v.innerHTML = `<div class="card"><div class="empty"><span class="spin"></span> 加载中</div></div>`;
    const R = {settings:Settings, library:Library, world:World, model:Model,
               culture:Culture, review:Review, staging:Staging, prompts:Prompts,
               crew:Crew, casting:Casting, epochs:Epochs,
               script:Script, prose:Prose, audio:Audio, tasks:Tasks}[p.id];
    try { await R.render(v); }
    catch (e) {
      v.innerHTML = `<div class="card"><h2 style="color:var(--danger)">加载失败</h2>
        <p class="hint">${h(e.message)}</p>
        <button class="btn" onclick="App.refresh()">重试</button>
        <div class="log" style="margin-top:12px" id="log"></div></div>`;
      const el = $("#log"); if (el) el.innerHTML = logBuf.join("\n");
      logErr(`${p.name} 加载失败：${e.message}`);
    }
    this.badge();
  },
  async health() {
    try {
      const r = await fetch("/health").then(x=>x.json());
      $("#dot-core").className = "dot " + (r.ok ? "ok" : "bad");
      $("#st-core").textContent = r.ok ? "v"+r.version : "异常";
    } catch { $("#dot-core").className="dot bad"; $("#st-core").textContent="离线"; }
    try {
      const eps = await api("GET", "/settings/endpoints");
      const ok = eps.some(e => e.health && e.health.ok);
      $("#dot-gw").className = "dot " + (ok ? "ok" : eps.length ? "bad" : "");
      $("#st-gw").textContent = eps.length ? (ok ? `${eps.length} 个正常` : "未探活") : "未配置";
    } catch { $("#dot-gw").className="dot bad"; $("#st-gw").textContent="—"; }
  },
  async badge() {
    try {
      const s = await api("GET", "/gen-tasks/summary");
      const el = $("#task-badge");
      el.innerHTML = s.active
        ? `<span class="spin"></span> ${s.active} 个任务运行中`
        : (s.failed ? `<span class="tag t-bad">${s.failed} 个失败</span>` : "");
    } catch {}
  },
};
App.boot();
</script>
</body>
</html>
